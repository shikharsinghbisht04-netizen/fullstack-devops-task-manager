services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 12
  backend:
    image: ${REGISTRY}/fullstack-backend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      MONGO_URL: mongodb://mongo:27017/appdb
      PORT: "5000"
    depends_on:
      mongo: { condition: service_healthy }
  frontend:
    image: ${REGISTRY}/fullstack-frontend:${IMAGE_TAG}
    restart: unless-stopped
    ports: ["${WEB_PORT:-80}:80"]
    depends_on: [backend]
volumes:
  mongo-data:
